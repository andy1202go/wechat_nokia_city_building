<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>摩天叠楼师 · 本地预览</title>
<script>
  /*
   * 错误收集器必须装在 <head>，即任何业务脚本之前。
   *
   * 起初这段写在页面底部，结果被 wx-shim.js 的初始化异常上了一课：
   * 报错发生在监听器注册之前，错误只进了 console，页面上留下的只是后面的
   * 连带错误 —— 典型的「白屏但只有一条无关报错」。
   *
   * 另外这里是**累积**而不是覆盖：连带错误往往更扎眼，会盖住真正的首因。
   */
  window.__errors = [];

  function recordError(text, detail) {
    window.__errors.push(text + (detail ? '\n' + detail : ''));
    const box = document.getElementById('err');
    if (box) {
      box.textContent = window.__errors.join('\n\n');
      box.classList.add('on');
    }
    console.error('[预览壳] ' + text, detail || '');
  }

  window.addEventListener('error', function (e) {
    recordError(
      '运行时报错：' + (e.message || '未知错误'),
      (e.error && e.error.stack) || 'at ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno
    );
  });

  window.addEventListener('unhandledrejection', function (e) {
    recordError('未处理的 Promise 拒绝', (e.reason && e.reason.stack) || String(e.reason));
  });
</script>
<style>
  :root {
    --ink: #1f2329;
    --muted: #8b909a;
    --line: #dcdfe6;
    --accent: #4a90d9;
    --panel: #ffffff;
    --bg: #eef0f4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .app {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    height: 100%;
    padding: 24px;
  }

  /* ---------- 左侧信息区 ---------- */

  .side {
    width: 268px;
    flex: 0 0 auto;
  }

  .side h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: .5px;
  }

  .side .sub {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 12px;
  }

  .stats {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 3px 0;
    font-size: 13px;
  }

  .row .k { color: var(--muted); }

  .row .v {
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .row.hi .v { color: var(--accent); font-weight: 600; }

  .btns { display: flex; gap: 8px; margin-bottom: 16px; }

  button {
    flex: 1;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { transform: translateY(1px); }

  .tips {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 12px;
    color: var(--muted);
  }

  .tips li {
    padding-left: 14px;
    position: relative;
    margin-bottom: 5px;
  }

  .tips li::before {
    content: "·";
    position: absolute;
    left: 4px;
    color: var(--accent);
    font-weight: 700;
  }

  /* ---------- 右侧机身 ---------- */

  .phone {
    --h: min(780px, calc(100vh - 108px));
    position: relative;
    flex: 0 0 auto;
    height: var(--h);
    width: calc(var(--h) * 375 / 667);
    padding: 10px;
    background: #fff;
    border-radius: 26px;
    box-shadow: 0 10px 30px rgba(31, 35, 41, .14);
  }

  /* 震动脉冲：桌面上没有马达，把震动变成看得见的边框光晕 */
  .phone::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    pointer-events: none;
    opacity: 0;
  }

  .phone.buzz-light::after  { --c: 74, 144, 217;  animation: buzz .26s ease-out; }
  .phone.buzz-medium::after { --c: 242, 193, 78;  animation: buzz .26s ease-out; }
  .phone.buzz-heavy::after  { --c: 255, 107, 92;  animation: buzz .26s ease-out; }

  @keyframes buzz {
    0%   { opacity: 1; box-shadow: 0 0 0 0 rgba(var(--c), .85), inset 0 0 0 0 rgba(var(--c), .85); }
    100% { opacity: 0; box-shadow: 0 0 0 16px rgba(var(--c), 0), inset 0 0 0 16px rgba(var(--c), 0); }
  }

  #stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    background: #1b2430;
    border-radius: 18px;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
  }

  #stage canvas { display: block; touch-action: none; }

  /* ---------- 错误浮层 ---------- */

  .err {
    position: fixed;
    left: 24px;
    right: 24px;
    bottom: 24px;
    max-height: 42vh;
    overflow: auto;
    margin: 0;
    padding: 14px 16px;
    background: #2b1b1b;
    color: #ffd7d2;
    border: 1px solid #ff6b5c;
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    display: none;
    z-index: 10;
  }

  .err.on { display: block; }

  @media (max-width: 820px) {
    .app { flex-direction: column; gap: 18px; padding: 16px; overflow: auto; height: auto; }
    .side { width: min(420px, 100%); order: 2; }
    .phone { --h: min(70vh, 640px); order: 1; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <h1>摩天叠楼师</h1>
      <p class="sub">浏览器预览壳 · 跑的是工程里同一份 js/ 代码</p>

      <div class="stats">
        <div class="row"><span class="k">帧率</span><span class="v" id="s-fps">--</span></div>
        <div class="row"><span class="k">楼层</span><span class="v" id="s-floors">--</span></div>
        <div class="row"><span class="k">相位</span><span class="v" id="s-phase">--</span></div>
        <div class="row"><span class="k">机会余量</span><span class="v" id="s-budget">--</span></div>
        <div class="row"><span class="k">当前连击</span><span class="v" id="s-combo">--</span></div>
        <div class="row"><span class="k">本局人口</span><span class="v" id="s-pop">--</span></div>
        <div class="row hi"><span class="k">本局得分</span><span class="v" id="s-score">--</span></div>
        <div class="row"><span class="k">最高分</span><span class="v" id="s-best">--</span></div>
        <div class="row"><span class="k">结局</span><span class="v" id="s-ending">--</span></div>
        <div class="row"><span class="k">画布</span><span class="v" id="s-stage">--</span></div>
      </div>

      <div class="btns">
        <button type="button" id="btn-reload">重载页面</button>
        <button type="button" id="btn-clear">清除最高分</button>
      </div>

      <ul class="tips">
        <li>点画面任意位置投放楼层；吊车摆到哪儿，落点就是哪儿</li>
        <li>右上角可暂停；终局面板上可重开一局</li>
        <li>浏览器要求先有一次点击才允许出声，第一次点击后音效才会响</li>
        <li>改 <code>js/core/config.js</code> 后点「重载页面」即可看到新手感</li>
        <li>手机连同一局域网打开本机地址，能真触摸 + 真震动</li>
      </ul>
    </aside>

    <div class="phone" id="phone">
      <div id="stage"></div>
    </div>
  </div>

  <pre class="err" id="err"></pre>

  <!--
    这里必须用绝对路径。预览页挂在 '/'，而脚本实际在 '/dev/' 下；
    写成 './wx-shim.js' 会解析成 '/wx-shim.js' 而 404 ——
    而 <script> 加载失败既不触发 window.onerror、也不报错，只留下白屏。
  -->
  <script src="/dev/wx-shim.js"></script>
  <script src="/dev/loader.js"></script>
  <script>
    (function () {
      'use strict';

      // 收集器定义在 <head>（见文件顶部），这里直接用
      const showError = window.recordError || function (label, detail) {
        console.error(label, detail);
      };

      // 启动前置检查：缺任何一个都说明脚本没被加载上，直接说清楚是哪个文件
      if (!window.__devStage) {
        showError('平台适配层未加载', '找不到 /dev/wx-shim.js 导出的 __devStage。请确认该文件的路径与服务器返回码。');
        return;
      }
      if (!window.__cjs || typeof window.__cjs.boot !== 'function') {
        showError('模块加载器未加载', '找不到 /dev/loader.js 导出的 __cjs。请确认该文件的路径与服务器返回码。');
        return;
      }

      const BEST_KEY = 'skyline_dev:skyline_stacker_best_v1';

      function readBest() {
        try {
          const raw = localStorage.getItem(BEST_KEY);
          return raw === null ? 0 : JSON.parse(raw);
        } catch (err) {
          return 0;
        }
      }

      document.getElementById('btn-reload').addEventListener('click', function () {
        window.location.reload();
      });
      document.getElementById('btn-clear').addEventListener('click', function () {
        try { localStorage.removeItem(BEST_KEY); } catch (err) { /* 忽略 */ }
        window.location.reload();
      });

      // 帧率：直接在预览页数 rAF 次数，不改动游戏主循环
      let fps = 0;
      let frames = 0;
      let fpsMark = performance.now();
      function countFrame() {
        frames += 1;
        const now = performance.now();
        if (now - fpsMark >= 500) {
          fps = Math.round((frames * 1000) / (now - fpsMark));
          frames = 0;
          fpsMark = now;
        }
        requestAnimationFrame(countFrame);
      }
      requestAnimationFrame(countFrame);

      const stageInfo = window.__devStage;
      document.getElementById('s-stage').textContent =
        stageInfo.width + '×' + stageInfo.height + ' @' + stageInfo.dpr + 'x';

      const STAT_IDS = ['fps', 'floors', 'phase', 'budget', 'combo', 'pop', 'score', 'best', 'ending'];
      function setStats(values) {
        STAT_IDS.forEach(function (id) {
          const el = document.getElementById('s-' + id);
          if (el) el.textContent = values[id];
        });
      }

      let game = null;
      let core = null;

      function tick() {
        if (!game) {
          setStats({ fps: fps, stage: '', floors: '未启动', phase: '', budget: '',
                     combo: '', pop: '', score: '', best: readBest(), ending: '' });
          return;
        }

        const run = game.run;
        const playing = !run.ending;

        setStats({
          fps: fps,
          floors: core.run.floorCount(run),
          phase: run.phase,
          budget: run.missBudget + ' / ' + core.config.RUN.missBudget,
          combo: run.combo.count + '（最高 ' + run.combo.best + '）',
          pop: core.run.population(run),
          score: run.score,
          best: readBest(),
          ending: run.ending || (playing ? '进行中' : '—')
        });
      }

      setInterval(tick, 250);

      window.__cjs
        .boot()
        .then(function (result) {
          if (!result.game) {
            showError(
              '游戏未启动',
              'boot() 返回了空值，通常意味着平台适配层认定运行环境不可用。\n请检查 dev/wx-shim.js 是否在 loader.js 之前加载。'
            );
            return;
          }
          game = result.game;
          core = window.__cjs.load('/js/core/index.js');
          // 挂到全局，方便在控制台里直接看局面状态（如 __game.run.combo.count）
          window.__game = game;
          window.__core = core;
          tick();
        })
        .catch(function (err) {
          showError('加载源码失败', (err && err.stack) || String(err));
        });
    })();
  </script>
</body>
</html>
